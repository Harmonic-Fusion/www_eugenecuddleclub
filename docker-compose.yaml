services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecc
      POSTGRES_PASSWORD: ecc
      POSTGRES_DB: ecc
    ports:
      - "5432:5432"
    volumes:
      - ecc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecc -d ecc"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    ports:
      - "8000:8000"
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://ecc:ecc@db:5432/ecc
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  ecc_pgdata:
